name: Security Gate
on:
  push:
    branches: [main]
    tags: ["v*", "security-*"]
  pull_request:
permissions:
  contents: read
jobs:
  security-gate:
    name: Build + 50-case adversarial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck/build
        run: npm run build
      - name: Run adversarial security suite
        run: npm run test:security -- --reporter=json --outputFile=security-results.json
      - name: Refuse release on unauthorized ALLOW
        shell: bash
        run: |
          set -euo pipefail
          npm run test:security -- --reporter=verbose
          echo "Security gate passed: no unauthorized scenario reached ALLOW."
      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-diagnostics
          path: security-results.json
          if-no-files-found: ignore
